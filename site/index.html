<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rides dashboard</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Rides dashboard</h1>
    <nav><a href="./index.html">Home</a><a href="./holidays.html">Holidays</a></nav>
  </header>
  <main>
    <p>Starting point for the agentic SDLC lab. Daily ride counts for three cities, July to September 2026, loaded from <code>data/rides.csv</code>.</p>
    <p id="total" aria-live="polite">Loading data&hellip;</p>
    <section>
      <h2>Rides by city</h2>
      <table id="by-city">
        <thead><tr><th>City</th><th>Rides</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="chart" class="bars" role="img" aria-label="Bar chart of rides by city"></div>
    </section>
    <section>
      <h2>Average rides by day of the week</h2>
      <div id="weekday-chart" class="bars" role="img" aria-label="Bar chart of average rides per city on each day of the week, Monday to Sunday"></div>
    </section>
  </main>
  <script type="module">
    import { parseCsv } from "./src/csv.js";
    import { totalRides, ridesByCity, averageRidesByWeekday } from "./src/stats.js";
    import { barWidths } from "./src/bars.js";

    // Draw one bar per { label, value }, sized by barWidths.
    function drawBars(chart, items, format = (value) => value.toLocaleString()) {
      for (const { label, value, percent } of barWidths(items)) {
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.width = `${percent}%`;
        bar.textContent = `${label} ${format(value)}`;
        chart.appendChild(bar);
      }
    }

    const response = await fetch("./data/rides.csv");
    const rows = parseCsv(await response.text());
    const byCity = ridesByCity(rows);

    document.getElementById("total").textContent =
      `Total rides: ${totalRides(rows).toLocaleString()}`;

    const tbody = document.querySelector("#by-city tbody");
    for (const { city, rides } of byCity) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${city}</td><td>${rides.toLocaleString()}</td>`;
      tbody.appendChild(tr);
    }
    drawBars(
      document.getElementById("chart"),
      byCity.map(({ city, rides }) => ({ label: city, value: rides })),
    );
    drawBars(
      document.getElementById("weekday-chart"),
      averageRidesByWeekday(rows).map(({ weekday, rides }) => ({ label: weekday, value: rides })),
      (value) => value.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 }),
    );
  </script>
</body>
</html>
